.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}.chip{padding:8px 14px;border:1px solid var(--line);background:none;cursor:pointer;font-family:var(--head);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);transition:.3s}.chip.on,.chip:hover{color:var(--paper);border-color:var(--red);background:rgba(200,16,46,.12)}

.card .ov{position:absolute;inset:0;padding:20px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(transparent 40%,rgba(8,8,8,.92))}

.steps{display:grid;grid-template-columns:repeat(4,1fr);position:relative}.steps::before{content:"";position:absolute;top:7px;left:0;right:0;height:1px;background:var(--line)}
.step{padding:40px 24px 0 0;position:relative}.step::before{content:"";position:absolute;top:0;left:0;width:15px;height:15px;background:var(--red);border-radius:50%;box-shadow:0 0 0 6px var(--noir)}

#contact{text-align:center;overflow:hidden;background:radial-gradient(60% 50% at 50% 110%,rgba(200,16,46,.4),transparent 70%)}
#contact h2{font-size:clamp(2.8rem,10vw,9rem);margin-bottom:28px}#contact p{max-width:520px;margin:0 auto 36px;color:#cfcac2}
.cl{display:flex;flex-wrap:wrap;justify-content:center;gap:28px;margin-top:48px}.cl a{border-bottom:1px solid var(--red)}
form{display:grid;gap:18px;margin-top:20px}form label{display:grid;gap:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
input,select,textarea{background:var(--noir);border:1px solid var(--line);padding:14px;width:100%;border-radius:0}input:focus,select:focus,textarea:focus{border-color:var(--red);outline:0}
.hp{position:absolute;left:-9999px}@media(max-width:600px){.two{grid-template-columns:1fr}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv,.mask{opacity:1;transform:none;clip-path:none}h1 .r span{transform:none}}
</style></head>

<section id="insights"><div class="wrap"><p class="mono rv">05 / AUDIENCE</p><h2 class="rv">KNOW THE <em>AUDIENCE.</em></h2>
<div class="ins rv"><div class="panel"><h3>Age</h3>${bars(C.insights.age)}</div><div class="panel"><h3>Geography</h3>${bars(C.insights.geo)}</div><div class="panel"><h3>Gender</h3>${C.insights.gender.map(([l,v])=>`<div class="bar" style="margin:0 0 28px"><span class="mono">${esc(l)}</span><div class="big">${pct(v)}</div><div class="b" style="margin-top:12px"><i data-w="${v==null?0:v}"></i></div></div>`).join("")}</div></div>
<div class="ins rv" style="margin-top:16px;grid-template-columns:repeat(2,1fr)">${C.insights.reach.map(([l,v])=>`<div class="panel"><span class="mono">${esc(l)}</span><div class="big ${v==null?"ph":""}" style="margin-top:12px">${v==null?"--":esc(v)}</div></div>`).join("")}</div>
</div></section>

<section id="process"><div class="wrap"><p class="mono rv">06 / PROCESS</p><h2 class="rv">LET'S MAKE SOMETHING <em>WORTH WATCHING.</em></h2><div class="steps">${C.process.map(p=>`<div class="step rv"><b>${p[0]}</b><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join("")}</div></div></section>

<section id="contact"><div class="wrap"><p class="mono">07 / FINAL SCENE</p><h2 class="rv">EVERY GREAT STORY<br><em>STARTS SOMEWHERE.</em></h2><p>Have a brand, a product, or an idea worth bringing to life? Let's create something memorable.</p>
<button class="btn red" data-enq>START A COLLABORATION →</button>
<div class="cl"><a href="mailto:${esc(mail)}">${esc(mail)}</a><a href="${esc(ig)}" target="_blank" rel="noopener">Instagram ${esc(C.contact.handle)}</a>${safeUrl(C.contact.mediaKitUrl)?`<a href="${esc(C.contact.mediaKitUrl)}" download>Download media kit</a>`:""}</div></div></section>`;
$('#copy').textContent=C.contact.copyright;

/* portfolio */
$('#bgrid').innerHTML=C.brands.items.map((b,i)=>`<button class="brand" data-b="${i}" style="${b.placeholder?"":"border-style:solid"}"><div>${safeUrl(b.logo)?img(b.logo,b.brand):`<span class="lg">${esc(b.brand)}</span>`}<p class="mono" style="margin-top:10px">${b.placeholder?"Placeholder":"Case study"}</p></div><div><h3 style="font-size:1.4rem">${esc(b.campaign)}</h3><span class="mono">View →</span></div></button>`).join("");

/* modal */
const dlg=$('#dlg'),db=$('#dbody');
const embed=u=>{u=safeUrl(u);if(!u)return'';let m;
 if(m=u.match(/instagram\.com\/(reel|p)\/([\w-]+)/))return`<iframe src="https://www.instagram.com/${m[1]}/${m[2]}/embed" title="Instagram video" loading="lazy" allowfullscreen></iframe>`;
 if(m=u.match(/(?:youtu\.be\/|v=)([\w-]{11})/))return`<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" title="Video" loading="lazy" allowfullscreen></iframe>`;
 if(m=u.match(/vimeo\.com\/(\d+)/))return`<iframe src="https://player.vimeo.com/video/${m[1]}" title="Video" loading="lazy" allowfullscreen></iframe>`;
 return`<a class="btn red" href="${esc(u)}" target="_blank" rel="noopener">Watch video →</a>`};
const col=(h,t)=>t?`<div><h4>${h}</h4><p>${esc(t)}</p></div>`:"";
$('#app').addEventListener('click',e=>{
 const c=e.target.closest('[data-p]'),b=e.target.closest('[data-b]'),q=e.target.closest('[data-enq]');
 if(c){const p=C.projects[c.dataset.p];db.innerHTML=`<p class="mono">${esc(p.category)}</p><h2 style="font-size:clamp(2rem,5vw,4rem);margin:10px 0">${esc(p.title)}</h2><div class="vid">${embed(p.video)}</div><div class="cols">${col("Concept",p.description)}${col("Execution",p.execution)}${col("Results",p.results)}</div>`;dlg.showModal()}
 else if(b){const x=C.brands.items[b.dataset.b];db.innerHTML=`<p class="mono">${x.placeholder?"Placeholder — not a real collaboration":"Case study"}</p><h2 style="font-size:clamp(2rem,5vw,4rem);margin:10px 0">${esc(x.brand)} — ${esc(x.campaign)}</h2><div class="cols" style="margin-top:28px">${col("Brief",x.brief)}${col("Concept",x.concept)}${col("Delivered",x.delivered)}</div><div class="cols" style="margin-top:24px">${col("Performance",x.performance)}<div><h4>Published</h4>${safeUrl(x.link)?`<a class="btn" href="${esc(x.link)}" target="_blank" rel="noopener">View content →</a>`:""}</div></div>`;dlg.showModal()}
 else if(q){e.preventDefault();enquiry(q.dataset.enq||"")}});
$('#dx').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target==dlg)dlg.close()});
function enquiry(topic){db.innerHTML=`<p class="mono">New enquiry${topic?" · "+esc(topic):""}</p><h2 style="font-size:clamp(2rem,5vw,3.6rem);margin:10px 0 20px">LET'S MAKE IT.</h2>
<form id="f" novalidate><div class="two"><label><span class="mono">Name *</span><input name="name" required autocomplete="name"></label><label><span class="mono">Brand *</span><input name="brand" required></label></div>
<label><span class="mono">Email *</span><input name="email" type="email" required autocomplete="email"></label>
<label><span class="mono">Campaign objective *</span><textarea name="objective" rows="3" required>${topic?esc(topic)+": ":""}</textarea></label>
<div class="two"><label><span class="mono">Budget range</span><select name="budget"><option>Not sure yet</option><option>Under ₹50k</option><option>₹50k – ₹1.5L</option><option>₹1.5L – ₹5L</option><option>₹5L+</option></select></label>
<label><span class="mono">Timeline</span><select name="timeline"><option>Flexible</option><option>Within 2 weeks</option><option>1 month</option><option>2–3 months</option></select></label></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="btn red" type="submit">Send enquiry →</button><p class="mono" id="fs" role="status"></p></form>`;dlg.showModal();
 $('#f').onsubmit=async ev=>{ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f));
  if(d.website)return;if(!d.name||!d.brand||!/^\S+@\S+\.\S+$/.test(d.email)||!d.objective.trim()){$('#fs').textContent="Please complete all required fields with a valid email.";return}
  const ep=safeUrl(C.contact.formEndpoint);
  if(ep){try{const r=await fetch(ep,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)});if(!r.ok)throw 0;f.innerHTML='<p class="lead">Thank you — your enquiry has been sent.</p>';return}catch(_){$('#fs').textContent="Couldn't send. Opening your email app instead…"}}
  const body=`Name: ${d.name}\nBrand: ${d.brand}\nEmail: ${d.email}\nObjective: ${d.objective}\nBudget: ${d.budget}\nTimeline: ${d.timeline}`;
  location.href=`mailto:${mail}?subject=${encodeURIComponent("Collaboration enquiry — "+d.brand)}&body=${encodeURIComponent(body)}`}}

/* motion */
const tc=()=>{const t=Math.floor(performance.now()/1000),f=Math.floor(performance.now()/41.6)%24,p=n=>String(n).padStart(2,"0");return`${p(Math.floor(t/3600))}:${p(Math.floor(t/60)%60)}:${p(t%60)}:${p(f)}`};
setInterval(()=>{$$('.tc').forEach(e=>e.textContent=tc());$('#foot-tc').textContent="TC "+tc()},80);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let n=3;const L=$('#load b');const li=setInterval(()=>{n--;if(n<1||RM){clearInterval(li);$('#load').classList.add('off');document.body.classList.add('ready');$('#hero').classList.add('ready');document.documentElement.classList.add('ready');return}L.textContent=n},RM?0:330);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add('in');
 $$('[data-count]',t).forEach(el=>{const v=+el.dataset.count,s=el.dataset.suf,st=performance.now();(function k(now){const p=Math.min(1,(now-st)/1400);{const d=+el.dataset.dec||0;el.textContent=(v*(1-Math.pow(1-p,3))).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})+s}if(p<1&&!RM)requestAnimationFrame(k)})(st)});
 $$('[data-w]',t).forEach(el=>el.style.width=el.dataset.w+"%");io.unobserve(t)}),{threshold:.15});
$$('.rv,.mask').forEach(e=>io.observe(e));
/* nav indicator */
const links=$$('#links a'),ind=$('#ind');function mv(a){if(!a)return;ind.style.left=a.offsetLeft+"px";ind.style.width=a.offsetWidth+"px"}
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const a=links.find(l=>l.getAttribute('href')=="#"+e.target.id);links.forEach(l=>l.classList.toggle('on',l==a));mv(a)}}),{rootMargin:"-45% 0px -50% 0px"});
$$('main section').forEach(s=>so.observe(s));mv(null);
/* parallax */
if(!RM)addEventListener('scroll',()=>{const y=scrollY;const v=$('.hero-vis');if(v)v.style.transform=`translateY(${y*.12}px)`;const i=$('.frame img');if(i){const r=i.parentElement.getBoundingClientRect();i.style.transform=`scale(1.12) translateY(${(r.top-innerHeight/2)*-.04}px)`}},{passive:true});
</script></body></html>
